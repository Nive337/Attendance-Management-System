spring.application.name=attendance-management

spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate now only validates entity mappings against the schema.
# Flyway owns every schema change from here on.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - your "students"/"attendance" tables predate Flyway, so we baseline
# the current schema at version 0 and apply new migrations on top of it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT - wired up in Phase 5. Must be set via environment variable in every real environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}