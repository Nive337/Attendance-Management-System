<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #2f5bea;
            color: white;
            padding: 22px 45px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .top-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .top-section label {
            font-weight: bold;
            font-size: 17px;
        }

        #attendanceDate {
            margin-left: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #eef1f7;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .status-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 9px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .present {
            background: #d8f5df;
            color: #187333;
        }

        .absent {
            background: #ffdcdc;
            color: #c62828;
        }

        .present.selected {
            background: #28a745;
            color: white;
        }

        .absent.selected {
            background: #dc3545;
            color: white;
        }

        #saveButton {
            margin-top: 25px;
            background: #2f5bea;
            color: white;
            padding: 13px 28px;
            font-size: 17px;
        }

        #saveButton:hover {
            background: #2449c7;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>📝 Mark Attendance</h1>
</header>

<div class="container">

    <div class="top-section">
        <label for="attendanceDate">📅 Select Date:</label>

        <input type="date" id="attendanceDate">

        <p>
            Select the date and mark each student's attendance.
        </p>
    </div>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Roll Number</th>
                    <th>Student Name</th>
                    <th>Semester</th>
                    <th>Section</th>
                    <th>Attendance</th>
                </tr>
            </thead>

            <tbody id="studentTable">
                <tr>
                    <td colspan="6" class="loading">
                        Loading students...
                    </td>
                </tr>
            </tbody>
        </table>

        <button id="saveButton">
            💾 Save Attendance
        </button>

        <div id="message"></div>

    </div>

</div>

<script>

    let students = [];

    // Set today's date
    const today = new Date();
    const formattedDate =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    document.getElementById("attendanceDate").value = formattedDate;


    // Load students from backend
    async function loadStudents() {

        try {

            const response = await fetch("/api/students");

            if (!response.ok) {
                throw new Error("Failed to load students");
            }

            students = await response.json();

            displayStudents();

        } catch (error) {

            console.error(error);

            document.getElementById("studentTable").innerHTML = `
                <tr>
                    <td colspan="6" class="loading">
                        ❌ Could not load students.
                    </td>
                </tr>
            `;
        }
    }


    // Display students in table
    function displayStudents() {

        const table = document.getElementById("studentTable");

        table.innerHTML = "";

        if (students.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="loading">
                        No students found.
                    </td>
                </tr>
            `;

            return;
        }


        students.forEach(student => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${student.id}</td>

                <td>${student.rollNumber}</td>

                <td>${student.name}</td>

                <td>${student.semester}</td>

                <td>${student.section}</td>

                <td>
                    <div class="status-buttons">

                        <button
                            class="present"
                            onclick="selectAttendance(${student.id}, 'PRESENT', this)">
                            Present
                        </button>

                        <button
                            class="absent"
                            onclick="selectAttendance(${student.id}, 'ABSENT', this)">
                            Absent
                        </button>

                    </div>
                </td>
            `;

            table.appendChild(row);
        });
    }


    // Store selected attendance
    function selectAttendance(studentId, status, button) {

        const row = button.closest("tr");

        const buttons = row.querySelectorAll("button");

        buttons.forEach(btn => {
            btn.classList.remove("selected");
        });

        button.classList.add("selected");

        // Store selection on the row
        row.dataset.status = status;
        row.dataset.studentId = studentId;
    }


    // Save attendance
    document.getElementById("saveButton").addEventListener("click", async function() {

        const date = document.getElementById("attendanceDate").value;

        if (!date) {
            alert("Please select a date.");
            return;
        }

        const rows = document.querySelectorAll("#studentTable tr");

        let records = [];

        rows.forEach(row => {

            if (row.dataset.studentId && row.dataset.status) {

                records.push({
                    studentId: row.dataset.studentId,
                    status: row.dataset.status
                });

            }
        });


        if (records.length === 0) {

            alert("Please mark attendance for at least one student.");

            return;
        }


        const saveButton = document.getElementById("saveButton");

        saveButton.disabled = true;
        saveButton.innerText = "Saving...";


        try {

            for (const record of records) {

                const response = await fetch(
                    `/api/attendance/mark?studentId=${record.studentId}&date=${date}&status=${record.status}`,
                    {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Failed to save attendance for student ${record.studentId}`
                    );
                }
            }


            document.getElementById("message").innerHTML =
                "✅ Attendance saved successfully!";

        } catch (error) {

            console.error(error);

            document.getElementById("message").innerHTML =
                "❌ Something went wrong while saving attendance.";

        } finally {

            saveButton.disabled = false;
            saveButton.innerText = "💾 Save Attendance";
        }

    });


    // Start loading students
    loadStudents();

</script>

</body>
</html>
