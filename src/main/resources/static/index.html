<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #2f5bea;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            padding: 40px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 220px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .actions {
            margin-top: 40px;
        }

        .actions button {
            padding: 15px 25px;
            margin: 10px 10px 0 0;
            border: none;
            border-radius: 8px;
            background: #2f5bea;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .actions button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Attendance Management System</h1>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome! 👋</h2>
        <p>Manage student attendance easily.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>👨‍🎓 Total Students</h3>
            <div class="number" id="totalStudents">0</div>
        </div>

        <div class="card">
            <h3>📅 Today's Attendance</h3>
            <div class="number" id="todayAttendance">0%</div>
        </div>

        <div class="card">
            <h3>⚠️ Below 75%</h3>
            <div class="number" id="below75">0</div>
        </div>
    </div>

    <div class="actions">

        <h2>Quick Actions</h2>

        <button onclick="window.location.href='/attendance.html'">
            📝 Mark Attendance
        </button>
        <button onclick="window.location.href='/students.html'">
            👨‍🎓 Manage Students
        </button>
        <button onclick="window.location.href='/reports.html'">
            📊 View Reports
        </button>
    </div>

</div>
<script>

    async function loadDashboard() {

        try {

            const response = await fetch("/api/dashboard");

            if (!response.ok) {
                throw new Error("Failed to load dashboard data");
            }

            const data = await response.json();

            document.getElementById("totalStudents").innerText =
                data.totalStudents;

            document.getElementById("todayAttendance").innerText =
                data.todayAttendance + "%";

            document.getElementById("below75").innerText =
                data.below75;

        } catch (error) {

            console.error("Dashboard error:", error);

        }
    }

    loadDashboard();

</script>
</body>
</html>
