<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #2f5bea;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            padding: 35px 45px;
        }

        .form-card,
        .students-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            background: #2f5bea;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 11px 20px;
            background: #2f5bea;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .back-button:hover {
            background: #2449c7;
        }

        /* GROUP */

        .student-group {
            margin-bottom: 35px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .group-header {
            background: #eef1f7;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .group-header span {
            color: #2f5bea;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f8f9fb;
        }

        .delete-btn {
            background: #d9534f;
            margin: 0;
            padding: 7px 12px;
        }

        .delete-btn:hover {
            background: #c9302c;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 25px;
            font-size: 17px;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }

    </style>
</head>


<body>

<header>
    <h1>🎓 Student Management</h1>
</header>


<div class="container">

    <a href="/" class="back-button">
        ← Back to Dashboard
    </a>


    <!-- ADD STUDENT -->

    <div class="form-card">

        <h2>➕ Add Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="rollNumber">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="rollNumber"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="joiningYear">
                        Joining Year
                    </label>

                    <input
                        type="number"
                        id="joiningYear"
                        min="2000"
                        max="2100"
                        placeholder="Example: 2024"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <input
                        type="number"
                        id="semester"
                        min="1"
                        max="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="section">
                        Section
                    </label>

                    <input
                        type="text"
                        id="section"
                        placeholder="Example: A"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="parentName">
                        Parent Name
                    </label>

                    <input
                        type="text"
                        id="parentName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="parentPhone">
                        Parent Phone
                    </label>

                    <input
                        type="tel"
                        id="parentPhone"
                        required
                    >

                </div>

            </div>


            <button type="submit">
                Save Student
            </button>

        </form>


        <p id="message"></p>

    </div>


    <!-- STUDENTS -->

    <div class="students-card">

        <h2>👨‍🎓 Students</h2>

        <div id="studentGroups">

            <div class="loading">
                Loading students...
            </div>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // LOAD STUDENTS
    // ==========================================

    async function loadStudents() {

        const container =
            document.getElementById("studentGroups");

        container.innerHTML = `
            <div class="loading">
                Loading students...
            </div>
        `;

        try {

            const response =
                await fetch("/api/students");

            if (!response.ok) {
                throw new Error("Failed to load students");
            }

            const students =
                await response.json();

            displayStudents(students);

        } catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="loading">
                    ❌ Could not load students.
                </div>
            `;
        }
    }


    // ==========================================
    // DISPLAY STUDENTS GROUPED BY YEAR + SECTION
    // ==========================================

    function displayStudents(students) {

        const container =
            document.getElementById("studentGroups");

        container.innerHTML = "";


        if (students.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No students found.
                </div>
            `;

            return;
        }


        // ======================================
        // GROUP STUDENTS
        // ======================================

        const groups = {};


        students.forEach(student => {

            const year =
                student.joiningYear || "Unknown Year";

            const section =
                student.section || "Unknown Section";


            const groupKey =
                `${year}-${section}`;


            if (!groups[groupKey]) {

                groups[groupKey] = {
                    year: year,
                    section: section,
                    students: []
                };

            }


            groups[groupKey].students.push(student);

        });


        // ======================================
        // SORT GROUPS
        // ======================================

        const sortedGroups =
            Object.values(groups).sort((a, b) => {

                if (a.year !== b.year) {

                    return Number(a.year) - Number(b.year);

                }

                return a.section
                    .toString()
                    .localeCompare(
                        b.section.toString()
                    );

            });


        // ======================================
        // CREATE GROUPS
        // ======================================

        sortedGroups.forEach(group => {

            const groupDiv =
                document.createElement("div");

            groupDiv.className =
                "student-group";


            groupDiv.innerHTML = `

                <div class="group-header">

                    📚 Joining Year:
                    <span>${group.year}</span>

                    &nbsp; | &nbsp;

                    Section:
                    <span>${group.section}</span>

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Name</th>

                                <th>Roll Number</th>

                                <th>Joining Year</th>

                                <th>Semester</th>

                                <th>Section</th>

                                <th>Parent</th>

                                <th>Phone</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody>

                        </tbody>

                    </table>

                </div>

            `;


            const tbody =
                groupDiv.querySelector("tbody");


            // ==================================
            // ADD STUDENTS TO GROUP
            // ==================================

            group.students.forEach(student => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${student.id}
                    </td>

                    <td>
                        ${student.name}
                    </td>

                    <td>
                        ${student.rollNumber}
                    </td>

                    <td>
                        ${student.joiningYear || "-"}
                    </td>

                    <td>
                        ${student.semester}
                    </td>

                    <td>
                        ${student.section}
                    </td>

                    <td>
                        ${student.parentName}
                    </td>

                    <td>
                        ${student.parentPhone}
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">

                            Delete

                        </button>

                    </td>

                `;


                tbody.appendChild(row);

            });


            container.appendChild(groupDiv);

        });

    }


    // ==========================================
    // ADD STUDENT
    // ==========================================

    document
        .getElementById("studentForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const student = {

                    name:
                        document
                        .getElementById("name")
                        .value
                        .trim(),


                    rollNumber:
                        document
                        .getElementById("rollNumber")
                        .value
                        .trim(),


                    joiningYear:
                        parseInt(
                            document
                            .getElementById("joiningYear")
                            .value
                        ),


                    semester:
                        parseInt(
                            document
                            .getElementById("semester")
                            .value
                        ),


                    section:
                        document
                        .getElementById("section")
                        .value
                        .trim()
                        .toUpperCase(),


                    parentName:
                        document
                        .getElementById("parentName")
                        .value
                        .trim(),


                    parentPhone:
                        document
                        .getElementById("parentPhone")
                        .value
                        .trim()

                };


                const message =
                    document.getElementById("message");


                try {

                    const response =
                        await fetch(
                            "/api/students",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(student)

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to save student"
                        );

                    }


                    message.innerHTML =
                        "✅ Student added successfully!";


                    document
                        .getElementById("studentForm")
                        .reset();


                    loadStudents();


                } catch (error) {

                    console.error(error);

                    message.innerHTML =
                        "❌ Could not save student.";

                }

            }
        );


    // ==========================================
    // DELETE STUDENT
    // ==========================================

    async function deleteStudent(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this student?"
            );


        if (!confirmDelete) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/students/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to delete student"
                );

            }


            alert(
                "Student deleted successfully! ✅"
            );


            loadStudents();


        } catch (error) {

            console.error(error);

            alert(
                "Could not delete student ❌"
            );

        }

    }


    // ==========================================
    // START
    // ==========================================

    loadStudents();

</script>

</body>

</html>
